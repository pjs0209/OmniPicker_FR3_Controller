<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OmniPicker 설정</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/static/control.css"><link rel="stylesheet" href="/static/gripper-settings.css"></head><body>
<header><h1>OmniPicker 설정</h1><div><span class="mode">{{'DEMO' if demo else 'RS485'}}</span><time id="clock"></time><button id="stop" class="danger">FR3 정지</button></div></header>
<main><div class="options"><button id="rsTab" class="primary">RS485 제어·설정</button><button id="usbTab">USB 전용 기능</button></div><div id="connectionError" class="error-banner" hidden></div>
<div id="rsPanel"><section class="control-card"><div class="card-title"><h2>동작 파라미터</h2><span id="status" class="badge">미연결</span></div><div id="values" class="setting-values"></div><div class="options"><label><input id="acceptContact" type="checkbox"> 접촉 시 완료</label><button id="send" class="primary">이동</button><button id="stage">파라미터만 기록</button><button id="trigger">기록된 목표 실행</button><button id="wait">도달 확인</button></div><pre id="result"></pre><div class="arm-controls"><strong id="armState">잠금</strong><label><input id="areaClear" type="checkbox">작업영역 확인</label><button id="enable">60초 제어 허용</button><button id="lock">잠금</button></div></section>
<section class="control-card"><h2>속도·토크 입력 범위</h2><small>제조사 레지스터: 최소 0 · 최대 255 RAW · 현재 UI 범위는 아래 값 사용</small><div id="limitValues" class="setting-values"></div><div class="options"><button id="setLimits">입력 범위 적용</button><button id="fullRange">0~255 입력</button><button id="defaultRange">10~60 입력</button></div></section>
<section class="control-card"><div class="card-title"><h2>전체 RS485 레지스터</h2><button id="readRegisters">전체 조회</button></div><div class="register-scroll"><table><thead><tr><th>주소</th><th>항목</th><th>현재</th><th>쓰기</th></tr></thead><tbody id="registers"></tbody></table></div></section>
<section class="control-card"><h2>USB·CAN 전용 기능</h2><p>통신 모드·보드레이트·노드 ID, 모터 설정·MIT, 캘리브레이션, 오류 초기화, 플래시 저장·재부팅은 OP1 RS485 레지스터에서 제공되지 않습니다.</p><button id="openUSB">USB 설정 열기</button><div id="otherFeatures" class="feature-list"></div></section></div>
<div id="usbPanel" hidden><p>USB-C 연결 필요 · USB 연결 시 통합 제어는 잠깁니다.</p><iframe id="usbFrame" title="OmniPicker USB 설정"></iframe></div>
<details class="logs"><summary>로그</summary><div id="events"></div></details></main><div id="toast" class="toast" hidden role="status"></div><script>window.CONTROL_TOKEN={{token|tojson}};</script><script src="/static/common.js"></script><script src="/static/gripper-settings.js"></script></body></html>
